version: '3.8'

services:
  vibopedia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibopedia
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - vibopedia_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/categories"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vibopedia_data:
    driver: local
